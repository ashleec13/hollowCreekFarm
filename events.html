<!doctype html>
<html lang="en" data-bs-theme="light">

<head>
    <title>HOLLOW CREEK FARMS</title>

    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" />

    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="https://use.typekit.net/rfs2tot.css">
    <link rel="stylesheet" href="https://use.typekit.net/qlw2eqh.css">
    <link rel="icon" href="data:," />
</head>

<body>

    <header>
        <nav class="nav justify-content-center position-relative">
            <a class="nav-logo" href="index.html">
                <img src="client Files/Logos/mainLogoSemiColored.png" alt="Hollow Creek Logo">
            </a>

            <a class="nav-link" href="index.html">Home</a>
            <a class="nav-link" href="about.html">About Us</a>
            <a class="nav-link" href="shop.html">Shop</a>
        </nav>
    </header>

    <main>

        <!-- HERO -->
        <img class="heroImg" src="Client Files/Hero Imgs/hero-barn-creek-sunflowers-sunrise.png"
            alt="Hollow Creek Farm hero image">

        <!-- FILTER PANEL -->
        <div class="container my-4">

            <div class="card filter-panel p-4 mb-4 shadow-sm">
                <div class="row g-3 justify-content-center">

                    <!-- Search -->
                    <div class="col-md-4">
                        <input type="text" id="eventSearch" class="form-control" placeholder="Search events...">
                    </div>

                    <!-- Season Filter -->
                    <div class="col-md-3">
                        <select id="seasonFilter" class="form-select">
                            <option value="All">All Seasons</option>
                            <option value="spring">Spring</option>
                            <option value="summer">Summer</option>
                            <option value="fall">Fall</option>
                            <option value="winter">Winter</option>
                        </select>
                    </div>

                </div>
            </div>

            <!-- EVENT GRID -->
            <div id="eventList" class="row g-4 align-items-stretch"></div>

        </div>

    </main>

    <footer></footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Your data file (MUST load first) -->
    <script src="javaScript/eventList.js"></script>

    <!-- Main JS -->
    <script src="javaScript/script.js"></script>

</body>

</html>
