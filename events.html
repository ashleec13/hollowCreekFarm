<!doctype html>
<html lang="en" data-bs-theme="light">
<head>
    <title>Hollow Creek Farms - Events</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=Lato:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./styles.css" />
    <link rel="icon" href="data:," />
</head>
<body>

    <header>
        <nav class="navbar navbar-expand-lg navbar-dark fixed-top shadow">
            <div class="container-fluid px-4">
                <a class="navbar-brand d-flex align-items-center" href="./index.html">
                    <img src="./Client Files/Logos/mainLogoSemiColored.png" alt="Hollow Creek Logo" class="nav-logo-img">
                </a>
                
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <div class="collapse navbar-collapse justify-content-center" id="mainNav">
                    <ul class="navbar-nav text-center">
                        <li class="nav-item"><a class="nav-link" href="./index.html">Home</a></li>
                        <li class="nav-item"><a class="nav-link" href="./about.html">About Us</a></li>
                        <li class="nav-item"><a class="nav-link active" aria-current="page" href="./events.html">Events & Activities</a></li>
                    </ul>
                </div>

                <div class="store-sign-wrapper d-none d-lg-block">
                    <div class="store-sign">
                        <div class="sign" id="sign">
                            <div class="front text-center">Farm Is OPEN</div>
                            <div class="back text-center">Farm Is CLOSED</div>
                        </div>
                    </div>
                </div>
            </div>
        </nav>
    </header>

    <main style="margin-top: 120px;">
        <div class="container">
            
            <div class="text-center mb-5">
                <h1 class="display-4 text-uppercase fw-bold">Upcoming Farm Events</h1>
                <hr class="mx-auto style-divider">
                <p class="lead text-muted">Use the filters below to discover seasonal festivals and activities.</p>
            </div>

            <div class="card filter-panel p-4 mb-5 shadow-sm">
                <div class="row g-3 justify-content-center">
                    
                    <div class="col-md-5">
                        <label for="eventSearch" class="form-label fw-bold">Search Keywords</label>
                        <input type="text" id="eventSearch" class="form-control" placeholder="Type an event name...">
                    </div>

                    <div class="col-md-4">
                        <label for="seasonFilter" class="form-label fw-bold">Filter By Season</label>
                        <select id="seasonFilter" class="form-select">
                            <option value="All">All Seasons</option>
                            <option value="spring">Spring</option>
                            <option value="summer">Summer</option>
                            <option value="fall">Fall</option>
                            <option value="winter">Winter</option>
                        </select>
                    </div>

                </div>
            </div>

            <div id="eventList" class="row g-4 justify-content-center mb-5"></div>

        </div>
    </main>

    <footer>
        <div class="container text-center py-4">
            <p class="m-0 text-white-50 small">&copy; 2026 Hollow Creek Farm. All rights reserved.</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    
    <script src="./javaScript/eventList.js"></script>
    <script src="./javaScript/script.js"></script>

</body>
</html>
